<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benji's supervisions</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='erlenmeyer-flask.png') }}">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.min.js'></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
</head>
<body class="page page-calendar">
    <div class="site-shell">
        <header class="site-header">
            <a class="site-name" href="{{ url_for('index') }}">Benji's supervisions</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{{ url_for('index') }}" aria-current="page">Calendar</a>
                <a href="{{ url_for('questions_set') }}">Set work</a>
                <a href="{{ url_for('faq') }}">FAQ</a>
            </nav>
        </header>
        <main>
            <h1>Supervision signups</h1>
            <p class="intro">Select an available slot to sign up. Book once or repeat until the end of term.</p>
            <div class="calendar-legend" aria-label="Calendar key"><span><i class="legend-dot available-dot"></i> Available</span><span><i class="legend-dot booked-dot"></i> Booked</span></div>
            <div id="calendar"></div>
            <p class="help-text">Click a booked slot to see its details.</p>
        </main>
        <footer class="site-footer illustrated-footer">
            <a href="https://en.wikipedia.org/wiki/Mirex" aria-label="Mirex"><img src="{{ url_for('static', filename='mirex.png') }}" alt="Mirex molecule" class="molecule-image"></a>
            <a href="https://www.srcf.net/"><img src="https://www.srcf.net/images/poweredby-light-transparent.svg" alt="Powered by SRCF" class="srcf-badge"></a>
            <a href="https://en.wikipedia.org/wiki/Artemisinin" aria-label="Artemisinin"><img src="{{ url_for('static', filename='artemisinin.png') }}" alt="Artemisinin molecule" class="molecule-image"></a>
        </footer>
    </div>
    <div id="signupModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
        <div class="modal-content">
            <button type="button" class="close" aria-label="Close dialog">&times;</button>
            <h2 id="signupTitle">Sign up for supervision</h2>
            <form id="signupForm">
                <dl class="booking-summary">
                    <div><dt>Location</dt><dd id="supervisionLocation"></dd></div>
                    <div><dt>Time</dt><dd id="supervisionTime"></dd></div>
                    <div><dt>Date</dt><dd id="supervisionDate"></dd></div>
                </dl>
                <label for="name">CRSids of everyone in your group</label>
                <input type="text" id="name" placeholder="e.g. abc123, def456" required>
                <fieldset class="repeat-options">
                    <legend>Booking type</legend>
                    <label><input type="radio" name="repeatOption" value="repeat" required> Repeat until the end of term</label>
                    <label><input type="radio" name="repeatOption" value="oneoff" required> One-off</label>
                </fieldset>
                <button type="submit">Sign up</button>
            </form>
        </div>
    </div>
    <div id="bookedSlotModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="bookedTitle">
        <div class="modal-content">
            <button type="button" class="close" aria-label="Close dialog">&times;</button>
            <h2 id="bookedTitle">Supervision information</h2>
            <p id="bookedSlotInfo"></p>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var allEvents = [];
            var supervisionStartDate = new Date("{{ supervision_start_date }}");
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var calendar; // Declare calendar variable in a broader scope

            // Get view and date from localStorage or URL parameters
            const storedView = localStorage.getItem('calendarView');
            const storedDate = localStorage.getItem('calendarDate');
            const urlParams = new URLSearchParams(window.location.search);
            const viewParam = urlParams.get('view') || storedView || 'timeGridWeek';
            const dateParam = urlParams.get('date') || storedDate || supervisionStartDate.toISOString();

            console.log('Initial view:', viewParam);
            console.log('Initial date:', dateParam);

            fetch('/api/get_timeslots')
                .then(response => response.json())
                .then(data => {
                    allEvents = data;
                    console.log("All events:", allEvents);
                    initializeCalendar();
                });

            function initializeCalendar() {
                calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: viewParam,
                    initialDate: new Date(dateParam),
                    locale: 'en-GB',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek'
                    },
                    slotMinTime: '08:00:00',
                    slotMaxTime: '20:00:00',
                    height: 'auto',
                    allDaySlot: false,
                    selectMirror: true,
                    events: function(fetchInfo, successCallback, failureCallback) {
                        fetch('/api/get_timeslots')
                            .then(response => response.json())
                            .then(data => {
                                const events = data.map(event => ({
                                    id: event.id,
                                    title: event.is_available ? event.location : `${event.name} (${event.location})`,
                                    start: new Date(event.start_time),
                                    end: new Date(event.end_time),
                                    extendedProps: {
                                        is_available: event.is_available,
                                        isRepeated: event.is_repeated,
                                        name: event.name,
                                        location: event.location
                                    },
                                    className: event.is_available ? 'available-slot' : 'booked-slot'
                                }));
                                successCallback(events);
                            })
                            .catch(error => {
                                console.error('Error fetching events:', error);
                                failureCallback(error);
                            });
                    },
                    eventClick: function(info) {
                        if (info.event.extendedProps.is_available) {
                            signUp(info.event.id, info.event.extendedProps.location, info.event.start, info.event.end);
                        } else {
                            showBookedSlotInfo(info.event);
                        }
                    },
                    validRange: function(nowDate) {
                        return {
                            start: today
                        };
                    },
                    datesSet: function(info) {
                        console.log('View changed:', info.view.type);
                        console.log('Date changed:', info.start.toISOString());
                        localStorage.setItem('calendarView', info.view.type);
                        localStorage.setItem('calendarDate', info.start.toISOString());
                    }
                });
                calendar.render();
                console.log('Calendar after render:', calendar.view.type, calendar.getDate());
            }

            function signUp(slotId, location, start, end) {
                const modal = document.getElementById('signupModal');
                const closeBtn = document.getElementsByClassName('close')[0];
                const form = document.getElementById('signupForm');
                const locationSpan = document.getElementById('supervisionLocation');
                const dateSpan = document.getElementById('supervisionDate');
                const timeSpan = document.getElementById('supervisionTime');

                locationSpan.textContent = location;
                dateSpan.textContent = start.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
                timeSpan.textContent = formatDateTime(start) + ' - ' + formatDateTime(end);
                modal.style.display = 'block';

                closeBtn.onclick = function() {
                    modal.style.display = 'none';
                }

                window.onclick = function(event) {
                    if (event.target == modal) {
                        modal.style.display = 'none';
                    }
                }

                form.onsubmit = function(e) {
                    e.preventDefault();
                    const name = document.getElementById('name').value;
                    const repeat = document.querySelector('input[name="repeatOption"]:checked').value === 'repeat';

                    fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: slotId, name: name, repeat: repeat })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert(repeat ? 'Successfully signed up until the end of term!' : 'Successfully signed up for this slot!');
                            
                            modal.style.display = 'none';
                            form.reset();

                            console.log('Before refetchEvents:', calendar.getEvents().length);
                            calendar.refetchEvents();
                            console.log('After refetchEvents:', calendar.getEvents().length);
                            setTimeout(() => {
                                console.log('Delayed check - Events:', calendar.getEvents().length);
                                console.log('Event details:', calendar.getEvents().map(e => ({
                                    id: e.id,
                                    title: e.title,
                                    start: e.start,
                                    end: e.end
                                })));
                            }, 1000);  // Increased timeout to 1 second
                        } else {
                            alert('Failed to sign up: ' + data.message);
                            modal.style.display = 'none';
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred while signing up. Please try again.');
                        modal.style.display = 'none';
                    });
                }
            }

            function showBookedSlotInfo(event) {
                const modal = document.getElementById('bookedSlotModal');
                const closeBtn = modal.getElementsByClassName('close')[0];
                const infoElement = document.getElementById('bookedSlotInfo');

                const dateOptions = { day: '2-digit', month: '2-digit', year: 'numeric' };
                const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };

                const bookedBy = event.extendedProps.name || 'Unknown';
                const location = event.extendedProps.location || 'Unknown';
                const repeating = event.extendedProps.isRepeated ? 'Yes' : 'No';

                infoElement.replaceChildren();
                appendInfoLine(infoElement, 'Booked by', bookedBy);
                appendInfoLine(infoElement, 'Location', location);
                appendInfoLine(infoElement, 'Time', `${formatDateTime(event.start)} - ${formatDateTime(event.end)}`);
                appendInfoLine(infoElement, 'Date', event.start.toLocaleDateString('en-GB', dateOptions));
                appendInfoLine(infoElement, 'Repeating', repeating);

                modal.style.display = 'block';

                closeBtn.onclick = function() {
                    modal.style.display = 'none';
                }

                window.onclick = function(event) {
                    if (event.target == modal) {
                        modal.style.display = 'none';
                    }
                }
            }

            function formatDateTime(date) {
                return date.toLocaleString('en-GB', { 
                    timeZone: 'Europe/London',
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: false 
                });
            }

            function appendInfoLine(container, label, value) {
                const strong = document.createElement('strong');
                strong.textContent = `${label}: `;
                container.appendChild(strong);
                container.appendChild(document.createTextNode(value));
                container.appendChild(document.createElement('br'));
            }
        });
    </script>
</body>
</html>
